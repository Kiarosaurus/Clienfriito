services:
  postgres:
    image: postgres:15
    container_name: ccs_postgres
    restart: unless-stopped
    ports:
      # Loopback-only: the host can seed/inspect, but the DB is never reachable
      # from outside the machine (default credentials make 0.0.0.0 dangerous).
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-climate_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/database/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ccs_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-climate_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:6.0
    container_name: ccs_mongo
    restart: unless-stopped
    ports:
      # Loopback-only — same rationale as postgres. MONGO_HOST_PORT lets you pick
      # another host port when a local MongoDB already uses 27017.
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./infra/database/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - ccs_net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ccs_mosquitto
    restart: unless-stopped
    ports:
      # Abiertos (no loopback): el ESP32 simulado llega por host.wokwi.internal y,
      # con hardware real, el nodo entra por la red local. Solo desarrollo: el broker
      # acepta conexiones anonimas (ver infra/mqtt/mosquitto.conf).
      - "1883:1883"   # MQTT (ESP32, backend)
      - "9001:9001"   # MQTT sobre WebSocket (monitor del nodo)
    volumes:
      - ./infra/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - ccs_net

  backend:
    build: ./backend
    container_name: ccs_backend
    restart: unless-stopped
    ports:
      # Loopback-only: the public path is frontend-nginx → backend over the
      # internal network; exposing 8000 on 0.0.0.0 would bypass nginx (and its
      # security headers) and publish /docs. localhost keeps local dev working.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      POSTGRES_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-climate_db}
      SECRET_KEY: ${SECRET_KEY:-}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      WATSON_API_KEY: ${WATSON_API_KEY:-}
      WATSON_URL: ${WATSON_URL:-}
      WATSON_ASSISTANT_ID: ${WATSON_ASSISTANT_ID:-}
      WATSON_EXTENSION_KEY: ${WATSON_EXTENSION_KEY:-}
      # Ingesta MQTT de la telemetria del nodo ESP32 (app/services/mqtt_ingest.py)
      MQTT_ENABLED: ${MQTT_ENABLED:-true}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC: ${MQTT_TOPIC:-ccs/+/telemetry}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      mosquitto:
        condition: service_started
    volumes:
      # Dev convenience: host code overrides the image's COPY, so a git pull +
      # `docker compose restart backend` picks up changes without a rebuild.
      # Dependencies still come from the image — rebuild when requirements.txt
      # changes. Remove this mount for a fully image-pinned deployment.
      - ./backend:/app
    networks:
      - ccs_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    container_name: ccs_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ccs_net

networks:
  ccs_net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
