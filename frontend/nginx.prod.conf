# Production nginx for kiarosaurus.me. NOT baked into the image: the prod
# compose overlay (docker-compose.prod.yml) mounts this file over the dev
# config at runtime, so nginx changes need a container restart, not a rebuild,
# and the dev frontend/nginx.conf never has to be edited on the VM (git pull
# stays clean). No secrets here — domain and cert PATHS are public knowledge;
# the certs themselves live on the VM under /etc/letsencrypt.

# Redirección forzada de HTTP a HTTPS
server {
    listen 80;
    server_name kiarosaurus.me www.kiarosaurus.me;
    return 301 https://$host$request_uri;
}

# Servidor principal con SSL
server {
    listen 443 ssl;
    server_name kiarosaurus.me www.kiarosaurus.me;

    # Compose monta /etc/letsencrypt → /etc/nginx/ssl
    ssl_certificate /etc/nginx/ssl/live/kiarosaurus.me/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/kiarosaurus.me/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (HSTS is fully meaningful here: TLS terminates in this block).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend service
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # /docs y /openapi.json deliberadamente SIN publicar: la custom extension de
    # Watson consume openapi_watson.json (subido manualmente) y en runtime llama
    # a /api/v1/*. Para re-importar el spec desde la URL viva, descomentar temporalmente:
    # location /docs { proxy_pass http://backend:8000/docs; proxy_set_header Host $host; }
    # location /openapi.json { proxy_pass http://backend:8000/openapi.json; proxy_set_header Host $host; }
}
