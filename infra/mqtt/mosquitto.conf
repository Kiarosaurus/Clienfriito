# Broker MQTT del CCS (PROYECTO_REDEFINIDO, tarea 1.2).
#   1883  MQTT     -> el ESP32 (en Wokwi: host.wokwi.internal:1883) y el backend
#   9001  WebSocket -> el monitor del nodo en el navegador (ws://localhost:9001)
listener 1883
protocol mqtt

listener 9001
protocol websockets

# Solo para desarrollo local. Para desplegar en el VPS: allow_anonymous false +
# password_file (RNF-15) y, si se puede, TLS.
allow_anonymous true

# Los mensajes retenidos (status, config) no necesitan sobrevivir a un reinicio.
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
